@if (toasts.toast(); as t) {
  <div
    class="toast"
    [class.success]="t.kind === 'success'"
    [class.error]="t.kind === 'error'"
    role="status"
    aria-live="polite"
  >
    @if (t.kind === 'success') {
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <polyline points="8.5 12.2 11 14.7 15.8 9.6"></polyline>
      </svg>
    } @else {
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <line x1="12" y1="7.5" x2="12" y2="13"></line>
        <circle cx="12" cy="16.3" r=".6" fill="currentColor"></circle>
      </svg>
    }

    <div class="body">
      <div class="title">{{ t.title }}</div>
      @if (t.body) {
        <div class="detail">{{ t.body }}</div>
      }
    </div>

    <button type="button" class="close focus-ring" aria-label="Cerrar" (click)="toasts.dismiss()">×</button>
  </div>
}
