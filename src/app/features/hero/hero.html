<section class="hero">
  <div>
    <div class="pill"><span class="dot"></span>{{ i18n.t().hero_pill }}</div>
    <h1>{{ i18n.t().hero_title }}</h1>
    <p>{{ i18n.t().hero_sub }}</p>
    <div class="mono stack">LayoutLMv3 · ONNX Runtime · Neuronal Network · ~0.89s / cheque</div>
  </div>
  <div class="metrics">
    <div class="metrics-title">{{ i18n.t().metrics_title }}</div>
    <div class="metrics-grid">
      <div class="metric" style="border-color: #6d42d9">
        <div class="num value">9</div>
        <div class="label">{{ i18n.t().metric_fields }}</div>
      </div>
      <div class="metric" style="border-color: #5b7ed0">
        <div class="num value">95.4<span class="unit">%</span></div>
        <div class="label">{{ i18n.t().metric_acc }}</div>
      </div>
      <div class="metric" style="border-color: #0e9c9c">
        <div class="num value">0.89<span class="unit">s</span></div>
        <div class="label">{{ i18n.t().metric_lat }}</div>
      </div>
    </div>
  </div>
</section>
